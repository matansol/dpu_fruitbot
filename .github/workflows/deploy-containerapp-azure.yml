name: deploy-containerapp-azure

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Container image to deploy (optional override)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
      DEFAULT_IMAGE: ${{ vars.AZURE_CONTAINER_IMAGE }}
      AZURE_CONTAINERAPP_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPP_ENVIRONMENT }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_TARGET_PORT: ${{ vars.AZURE_TARGET_PORT }}
      AZURE_INGRESS: ${{ vars.AZURE_INGRESS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure context
        run: |
          az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o table

      - name: List Container Apps in resource group
        run: |
          az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].{name:name,location:location}" -o table

      - name: Resolve deployment image
        id: image
        shell: bash
        run: |
          IMAGE_INPUT="${{ github.event.inputs.image }}"
          if [ -n "$IMAGE_INPUT" ]; then
            echo "value=$IMAGE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEFAULT_IMAGE" ]; then
            echo "value=$DEFAULT_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "No image provided. Set workflow input 'image' or repo variable AZURE_CONTAINER_IMAGE."
            exit 1
          fi

      - name: Upsert Container App
        shell: bash
        run: |
          TARGET_PORT="${AZURE_TARGET_PORT:-8000}"
          INGRESS="${AZURE_INGRESS:-external}"

          set +e
          UPDATE_OUTPUT=$(az containerapp update \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.image.outputs.value }}" 2>&1)
          UPDATE_EXIT=$?
          set -e

          if [ $UPDATE_EXIT -eq 0 ]; then
            echo "Container App updated successfully."
            exit 0
          fi

          echo "$UPDATE_OUTPUT"

          if echo "$UPDATE_OUTPUT" | grep -qi "does not exist"; then
            if [ -z "$AZURE_CONTAINERAPP_ENVIRONMENT" ]; then
              echo "Container App does not exist and AZURE_CONTAINERAPP_ENVIRONMENT is not set."
              echo "Set repo variable AZURE_CONTAINERAPP_ENVIRONMENT (existing Container Apps environment name)."
              exit 1
            fi

            CREATE_ARGS=(
              --name "$AZURE_CONTAINERAPP_NAME"
              --resource-group "$AZURE_RESOURCE_GROUP"
              --environment "$AZURE_CONTAINERAPP_ENVIRONMENT"
              --image "${{ steps.image.outputs.value }}"
              --target-port "$TARGET_PORT"
              --ingress "$INGRESS"
            )

            if [ -n "$AZURE_LOCATION" ]; then
              CREATE_ARGS+=(--location "$AZURE_LOCATION")
            fi

            az containerapp create "${CREATE_ARGS[@]}"
          else
            echo "Update failed for a reason other than missing app."
            exit $UPDATE_EXIT
          fi

      - name: Show latest revision
        run: |
          az containerapp revision list \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].{name:name,active:active,createdTime:createdTime,image:properties.template.containers[0].image}" -o table
