name: deploy-containerapp-azure

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Container image to deploy (optional override)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
      DEFAULT_IMAGE: ${{ vars.AZURE_CONTAINER_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure context
        run: |
          az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o table

      - name: Resolve deployment image
        id: image
        shell: bash
        run: |
          IMAGE_INPUT="${{ github.event.inputs.image }}"
          if [ -n "$IMAGE_INPUT" ]; then
            echo "value=$IMAGE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEFAULT_IMAGE" ]; then
            echo "value=$DEFAULT_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "No image provided. Set workflow input 'image' or repo variable AZURE_CONTAINER_IMAGE."
            exit 1
          fi

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.image.outputs.value }}"

      - name: Show latest revision
        run: |
          az containerapp revision list \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].{name:name,active:active,createdTime:createdTime,image:properties.template.containers[0].image}" -o table
